<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lotus House — Initial setup</title><link rel="stylesheet" href="./style.css"></head><body><header class="top"><div class="brand">✧ THE LAST TOAST <small>AT LOTUS HOUSE</small></div><span class="caps">ONE-TIME INITIALISATION</span></header><main><div class="hero"><div class="inner"><span class="eyebrow">PRIVATE SETUP</span><h1>Prepare the gathering</h1><p>Create seven private character access PINs.</p></div></div><section class="box"><h2>Owner setup</h2><p class="muted">This screen never selects the murderer. It generates one private PIN per guest. Once your game has been initialised, setup cannot be repeated.</p><div class="field"><label for="secret">Netlify SETUP_SECRET</label><input type="password" id="secret" autocomplete="off" placeholder="Your private setup secret"></div><button id="go">Generate seven PINs</button><div id="result"></div></section></main><script>
const e=document.getElementById('result');document.getElementById('go').onclick=async()=>{if(!confirm('Create seven access PINs? Only do this once.'))return;try{let r=await fetch('/api/bootstrap',{method:'POST',headers:{'content-type':'application/json','x-setup-secret':document.getElementById('secret').value},body:'{}'});let d=await r.json();if(!r.ok)throw Error(d.error);let text=d.pins.map(p=>p.name+' — '+p.pin).join('\n');e.innerHTML='<div class="note"><p>Setup completed. Save the PINs now and send each guest only their own.</p></div><div class="field"><textarea id="pins" rows="10" readonly></textarea></div><button id="copy">Copy PIN list</button><p class="small muted">No murderer is designated by these PINs. The person who already received the murderer card must confirm it in the app.</p>';document.getElementById('pins').value=text;document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(text);alert('PIN list copied.');};}catch(err){e.textContent=err.message;}};
</script></body></html>
